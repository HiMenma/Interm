name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test
    runs-on: macos-15
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build app bundle
        run: make build

      - name: Unit tests
        run: make test

      - name: Self-test (structure / signature / registration)
        run: ./Scripts/selftest.sh

      - name: Package app for artifact
        if: success()
        run: ditto -c -k --keepParent dist/Interm.app Interm-app.zip

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Interm-app
          path: Interm-app.zip
          if-no-files-found: warn
          retention-days: 7
